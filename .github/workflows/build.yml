name: Build SOFT CAPPER

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows (VST3)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: WebView2 SDK (static loader)
        shell: pwsh
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.1901.177 -OutputDirectory "${{ github.workspace }}/webview2"

      - name: Configure
        shell: pwsh
        run: |
          $wv = "${{ github.workspace }}/webview2" -replace '\\','/'
          cmake -S . -B build -A x64 -DJUCE_WEBVIEW2_PACKAGE_LOCATION="$wv"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item -Recurse "build/SoftCapper_artefacts/Release/VST3/SOFT CAPPER.vst3" "out/SOFT CAPPER.vst3"

      - uses: actions/upload-artifact@v4
        with:
          name: SOFT-CAPPER-Windows-VST3
          path: out

  macos:
    name: macOS (VST3 + AU, Universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package (ad-hoc signed)
        run: |
          mkdir -p out
          cp -R "build/SoftCapper_artefacts/Release/VST3/SOFT CAPPER.vst3" out/
          cp -R "build/SoftCapper_artefacts/Release/AU/SOFT CAPPER.component" out/
          codesign --force --deep -s - "out/SOFT CAPPER.vst3"
          codesign --force --deep -s - "out/SOFT CAPPER.component"
          cd out && zip -r -y -X ../SOFT-CAPPER-macOS.zip "SOFT CAPPER.vst3" "SOFT CAPPER.component"

      - uses: actions/upload-artifact@v4
        with:
          name: SOFT-CAPPER-macOS-VST3-AU
          path: SOFT-CAPPER-macOS.zip
